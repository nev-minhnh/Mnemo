name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # SQLCipher is built with a vendored OpenSSL, which needs Perl (preinstalled) and NASM.
      - uses: ilammy/setup-nasm@v1

      - name: Unit tests
        working-directory: src-tauri
        run: cargo test --locked

      - name: Build Mnemo (exe + installer)
        working-directory: src-tauri
        run: npx --yes @tauri-apps/cli@2 build --ci

      - name: Package zips
        run: |
          $conf = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $v = $conf.version
          New-Item -ItemType Directory -Force dist/Mnemo | Out-Null
          Copy-Item src-tauri/target/release/Mnemo.exe dist/Mnemo/
          Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Copy-Item -Destination dist/Mnemo/
          Copy-Item README.md, LICENSE-MIT, LICENSE-APACHE dist/Mnemo/
          Compress-Archive -Path dist/Mnemo/* -DestinationPath "dist/Mnemo-$v-windows-x64.zip"
          git archive --format=zip --prefix=Mnemo/ -o "dist/Mnemo-$v-source.zip" HEAD
          Get-ChildItem dist/*.zip | Format-Table Name, Length
          "MNEMO_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - uses: actions/upload-artifact@v4
        with:
          name: Mnemo-windows-x64
          path: dist/Mnemo-*-windows-x64.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: Mnemo-source
          path: dist/Mnemo-*-source.zip
          if-no-files-found: error

      # Every build of main (or a v* tag) is published as release v<version>.
      - name: Release
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.MNEMO_VERSION }}
          name: Mnemo ${{ env.MNEMO_VERSION }}
          target_commitish: ${{ github.sha }}
          body: "Every chat in sight, locked safe and tight. Mnemo-${{ env.MNEMO_VERSION }}-windows-x64.zip contains the portable Mnemo.exe and the installer."
          files: dist/*.zip
          overwrite_files: true
