[package]
name = "mnemo"
description = "Mnemo – Every chat in sight, locked safe and tight."
authors = ["nev-minhnh"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/nev-minhnh/Mnemo"
rust-version = "1.85"
version = "0.9.0"
edition = "2024"

[lib]
name = "mnemo_lib"
crate-type = ["rlib"]

[[bin]]
name = "Mnemo"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.11.1"
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
futures-util = "0.3.34"
hex = "0.4.3"
hkdf = "0.13.0"
log = "0.4.35"
rand = "0.8"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "stream"] }
rusqlite = { version = "0.41.1", features = ["bundled-sqlcipher-vendored-openssl"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tauri = { version = "2", features = ["unstable", "devtools", "tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "fs", "macros"] }
url = "2.5.8"
zip = "9.5.0"

[build-dependencies]
tauri-build = "2"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "unwind"

[target."cfg(windows)".dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
webview2-com = "0.39"
