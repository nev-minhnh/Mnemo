<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>Mnemo – thông báo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    html, body { background: transparent !important; overflow: hidden; }
    #list { display: flex; flex-direction: column; justify-content: flex-end; gap: 8px; height: 100vh; padding: 4px 6px; }
    .note {
      position: relative; display: grid; grid-template-columns: 40px 1fr; gap: 4px 10px; padding: 10px 12px;
      height: 124px; border-radius: 12px; background: linear-gradient(135deg, var(--surface), var(--surface-2)); border: 1px solid var(--border);
      box-shadow: 0 6px 24px rgba(3, 8, 30, .35), inset 3px 0 0 var(--gold-2); cursor: pointer; animation: slide .2s ease-out; overflow: hidden;
    }
    .note:hover { border-color: var(--accent-2); box-shadow: 0 6px 26px var(--glow), inset 3px 0 0 var(--gold-2); }
    @keyframes slide { from { transform: translateX(24px); opacity: 0; } }
    .note .av { grid-row: 1 / span 4; align-self: start; }
    .note .app { display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 13px; color: var(--gold); letter-spacing: .02em; }
    .note .line { display: flex; gap: 6px; font-size: 12.5px; min-width: 0; }
    .note .line b { flex: none; color: var(--text-2); font-weight: 600; }
    .note .line span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .note .time { margin-left: auto; flex: none; color: var(--text-3); font-size: 12px; }
    .note .body { font-size: 12.5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .note .body b { color: var(--text-2); font-weight: 600; }
    .note .x { position: absolute; top: 6px; right: 6px; width: 22px; height: 22px; border: 0; border-radius: 6px; background: transparent; color: var(--text-3); cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .note .x:hover { background: var(--surface-2); color: var(--text); }
    .note .bar { position: absolute; left: 0; bottom: 0; height: 2px; background: linear-gradient(90deg, var(--accent), var(--accent-2)); }
  </style>
</head>
<body>
  <div id="list"></div>
  <script src="i18n.js"></script>
  <script src="common.js"></script>
  <script src="notify.js"></script>
</body>
</html>
